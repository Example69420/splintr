<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-label="SoundKey architecture">
<title>SoundKey architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1f"/></marker></defs>
<rect width="880" height="620" fill="#ffffff"/>
<text x="440" y="40" font-size="20" fill="#1b1b1f" text-anchor="middle" font-weight="bold" font-family="sans-serif">SoundKey — accessibility-first audio interface</text>
<text x="440" y="62" font-size="13" fill="#5c5c66" text-anchor="middle" font-weight="normal" font-family="sans-serif">every box is operable and perceivable without the screen</text>
<rect x="60" y="110" width="240" height="70" rx="8" fill="#ffffff" stroke="#56B4E9" stroke-width="3" opacity="1.0"/>
<text x="74" y="136" font-size="15" fill="#56B4E9" text-anchor="start" font-weight="bold" font-family="sans-serif">Simplified input handler</text>
<text x="74" y="156" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">10 fixed gestures · same meaning everywhere</text>
<rect x="60" y="230" width="240" height="80" rx="8" fill="#ffffff" stroke="#0072B2" stroke-width="3" opacity="1.0"/>
<text x="74" y="256" font-size="15" fill="#0072B2" text-anchor="start" font-weight="bold" font-family="sans-serif">Accessible navigation model</text>
<text x="74" y="276" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">announce item · confirm action · signal edges</text>
<rect x="360" y="110" width="260" height="90" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="3" opacity="1.0"/>
<text x="374" y="136" font-size="15" fill="#009E73" text-anchor="start" font-weight="bold" font-family="sans-serif">Audio feedback engine</text>
<text x="374" y="156" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">tones + patterns + spoken captions + verbosity</text>
<rect x="360" y="250" width="260" height="90" rx="8" fill="#ffffff" stroke="#E69F00" stroke-width="3" opacity="1.0"/>
<text x="374" y="276" font-size="15" fill="#E69F00" text-anchor="start" font-weight="bold" font-family="sans-serif">Result sonifier</text>
<text x="374" y="296" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">proximity=rate · category=pitch · found/level/count</text>
<rect x="60" y="360" width="240" height="80" rx="8" fill="#ffffff" stroke="#CC79A7" stroke-width="3" opacity="1.0"/>
<text x="74" y="386" font-size="15" fill="#CC79A7" text-anchor="start" font-weight="bold" font-family="sans-serif">Function adapters</text>
<text x="74" y="406" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">wrap Flipper functions in the accessible model</text>
<rect x="360" y="400" width="260" height="70" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="3" opacity="1.0"/>
<text x="374" y="426" font-size="15" fill="#D55E00" text-anchor="start" font-weight="bold" font-family="sans-serif">Sound-cue library</text>
<text x="374" y="446" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">single source of truth (cues/*.json)</text>
<rect x="660" y="110" width="160" height="360" rx="8" fill="#ffffff" stroke="#5c5c66" stroke-width="3" opacity="1.0"/>
<text x="674" y="136" font-size="15" fill="#5c5c66" text-anchor="start" font-weight="bold" font-family="sans-serif">Settings</text>
<text x="674" y="156" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">• speech vs tones</text>
<text x="674" y="178" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">• haptic channel</text>
<text x="674" y="200" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">• speed</text>
<text x="674" y="222" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">• volume</text>
<text x="674" y="244" font-size="11" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">• verbosity</text>
<text x="70" y="96" font-size="12" fill="#5c5c66" text-anchor="start" font-weight="normal" font-family="sans-serif">buttons →</text>
<line x1="180" y1="180" x2="180" y2="230" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="300" y1="250" x2="360" y2="165" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="310" x2="180" y2="360" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="300" y1="400" x2="360" y2="300" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="490" y1="400" x2="490" y2="340" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="250" x2="590" y2="205" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="290" x2="620" y2="200" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="490" y1="200" x2="490" y2="250" stroke="#1b1b1f" stroke-width="2"/>
<line x1="490" y1="340" x2="490" y2="400" stroke="#1b1b1f" stroke-width="2"/>
<rect x="180" y="520" width="520" height="56" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="3" opacity="1.0"/>
<line x1="490" y1="470" x2="490" y2="520" stroke="#009E73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="545" font-size="14" fill="#009E73" text-anchor="middle" font-weight="bold" font-family="sans-serif">audio out → 🔊 tones · patterns · speech</text>
<text x="440" y="566" font-size="12" fill="#5c5c66" text-anchor="middle" font-weight="normal" font-family="sans-serif">+ optional 📳 haptic channel</text>
</svg>
