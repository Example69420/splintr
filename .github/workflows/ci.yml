name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Simulator, tests, figures (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite (no third-party dependencies)
        run: python3 -m unittest discover -s tests -v

      - name: Regenerate the C cue header and check it is committed in sync
        run: |
          python3 cues/generate_c_header.py
          git diff --exit-code src/soundkey_cues.h \
            || (echo "src/soundkey_cues.h is out of date — run cues/generate_c_header.py" && exit 1)

      - name: Regenerate figures and evaluation
        run: |
          python3 figures/generate_figures.py
          python3 eval/run_eval.py

      - name: Render audio demos + GIF from a clean checkout
        run: |
          cd sim && python3 -m soundkey_sim.cli export-demos ../media
          cd .. && python3 media/generate_gif.py
